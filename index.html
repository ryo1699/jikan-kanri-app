<h1>時間管理</h1>
<p>一日の時間の使い方を記録・振り返るための、個人用の Mac アプリです。</p>
<p>Google カレンダーと連携すると、その日の予定をタイムライン上に下書きとして表示し、クリックひとつで記録として確定できます。</p>
<h2>Google カレンダー連携について</h2>
<ul>
<li>カレンダーへのアクセスは<strong>読み取りのみ</strong>です。予定の作成・変更・削除は行いません。</li>
<li>取得したデータはお使いの端末内にだけ保存され、外部のサーバーへは送信しません。</li>
</ul>
